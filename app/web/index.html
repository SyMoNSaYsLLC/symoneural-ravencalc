<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SyMoNeuRaL • RavenCalc 🎄</title>

<style>

/* ============================================================
   FIX: Dropdown / Select visibility + arrow
   ============================================================ */
select,
select option,
select optgroup {
  background-color: #0f151b !important;
  color: #eaf2ff !important;
}

.select-wrap {
  position: relative;
}

.select-wrap::after {
  content: "▾";
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: rgba(255,255,255,0.65);
  font-size: 14px;
}

select {
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  padding-right: 34px;
  border: 1px solid rgba(255,255,255,0.10);
}

select:focus {
  outline: 2px solid rgba(120, 200, 255, 0.35);
  outline-offset: 2px;
}

/* ============================================================
   THEME
   ============================================================ */
:root{
  --card: rgba(255,255,255,0.08);
  --card2: rgba(255,255,255,0.06);
  --text: rgba(255,255,255,0.92);
  --muted: rgba(255,255,255,0.65);
  --border: rgba(255,255,255,0.14);
  --shadow: 0 10px 35px rgba(0,0,0,0.45);
  --radius: 18px;
  --ok: #22c55e;
  --warn: #f59e0b;
  --bad: #ef4444;
}

body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  background:
    radial-gradient(1000px 600px at 15% 10%, rgba(16,185,129,.18), transparent 60%),
    radial-gradient(900px 500px at 85% 15%, rgba(245,158,11,.14), transparent 55%),
    radial-gradient(1100px 700px at 50% 95%, rgba(59,130,246,.12), transparent 60%),
    linear-gradient(180deg,#061014,#03070a);
  color:var(--text);
  min-height:100vh;
}

.snow{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.45;
  background:
    radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(1.5px 1.5px at 120px 140px, rgba(255,255,255,.7), transparent 60%),
    radial-gradient(2px 2px at 260px 90px, rgba(255,255,255,.8), transparent 60%),
    radial-gradient(1.5px 1.5px at 400px 180px, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(2px 2px at 520px 60px, rgba(255,255,255,.9), transparent 60%);
  background-size:600px 220px;
  animation:drift 10s linear infinite;
}
@keyframes drift{
  from{transform:translateY(-30px)}
  to{transform:translateY(30px)}
}

.wrap{max-width:880px;margin:0 auto;padding:24px 14px 44px}
h1{margin:6px 0 4px;font-size:clamp(28px,4vw,44px)}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(12px);
  padding:16px;
}

.status{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{
  flex:1;min-width:200px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 10px;
  display:flex;gap:8px;align-items:center;
  font-size:14px;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}

textarea,input,select{
  width:100%;
  box-sizing:border-box;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:12px;
  padding:10px;
  color:var(--text);
  font-size:14px;
}

textarea{
  min-height:110px;
  resize:vertical;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}

label{font-size:12px;color:var(--muted);margin:8px 0 4px;display:block}

button{
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.10);
  color:var(--text);
  border-radius:14px;
  padding:10px 13px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}

button.primary{background:rgba(34,197,94,0.18);border-color:rgba(34,197,94,0.35)}
button.secondary{background:rgba(245,158,11,0.16);border-color:rgba(245,158,11,0.35)}

.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}

.result{
  margin-top:12px;
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  padding:10px;
  min-height:96px;
}

.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--muted)}
.small{font-size:12px}

footer{text-align:center;margin-top:14px;font-size:12px;color:var(--muted)}
</style>
</head>

<body>
<div class="snow"></div>
<div class="wrap">
<h1>SyMoNeuRaL • RavenCalc 🎄</h1>
<p class="sub">A calculus quick-checker for Raven — holiday edition.</p>

<div class="card">
<div class="status">
  <div class="pill"><span class="dot ok"></span><b>API ok</b></div>
  <div class="pill"><span class="dot ok"></span><b>No key typing</b></div>
  <div class="pill"><span class="dot ok"></span><b>SymPy powered</b></div>
</div>

<label>Expression / equation</label>
<textarea id="expression" placeholder="sin(x)/x"></textarea>

<label>Operation</label>
<div class="select-wrap">
  <select id="operation">
    <option value="simplify">Simplify</option>
    <option value="differentiate">Differentiate</option>
    <option value="integrate">Integrate</option>
    <option value="limit">Limit</option>
    <option value="solve">Solve</option>
  </select>
</div>

<div class="actions">
  <button class="primary">Compute 🎁</button>
  <button class="secondary">Example ✨</button>
</div>

<div class="result mono">—</div>
<footer>💜 Built for Raven • Merry Christmas • SyMoNeuRaL</footer>
</div>
</div>
</body>
</html>
